server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Exact checkout, OTP, Donation and subscription SDK Shadow DOM stylesheets.
    # Arbitrary inline styles remain blocked.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://127.0.0.1:* http://localhost:*; img-src 'self' data:; style-src 'self' 'sha256-prKp3eEPSNa2wgG5n3m0PLVoBQCxoy0iOZu61zxHSiA=' 'sha256-eD+GA3VtZu+RW+18cTefkFWG73vBFDvmsj67/CZYZMs=' 'sha256-hg8MdnrtyV5y54Ad4z4dTVVVzoqyksujElqXljWiPhk=' 'sha256-oAhG5DyJ/Yyj2xFFcUwFqljsA2kWYh02LqDFizj2plA='; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|map|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
