server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Exact checkout, OTP, Donation and subscription SDK Shadow DOM stylesheets.
    # Arbitrary inline styles remain blocked.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.stripe.com http://127.0.0.1:* http://localhost:*; img-src 'self' data:; style-src 'self' 'sha256-HOUlC+CJIYCGelbn67Ej16SQ0d752rAxnOlfB0Orrvo=' 'sha256-eD+GA3VtZu+RW+18cTefkFWG73vBFDvmsj67/CZYZMs=' 'sha256-zFr4CzDBlu/8ka0jjBKoY+7ZI/oygj9ZXLFCwRgSsjU=' 'sha256-oAhG5DyJ/Yyj2xFFcUwFqljsA2kWYh02LqDFizj2plA='; script-src 'self' https://js.stripe.com https://*.js.stripe.com 'sha256-UBodp8UhLR9ASBc1PNRKcs3r2CjAFWxCbrUGPN7u1jo='; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /payment-return {
        access_log off;
        try_files /payment-return.html =404;
    }
    location = /payment-return.html {
        access_log off;
        try_files $uri =404;
    }

    location = /subscription-return {
        access_log off;
        try_files /subscription-return.html =404;
    }
    location = /subscription-return.html {
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|map|woff2?)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
