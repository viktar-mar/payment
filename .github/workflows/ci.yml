name: Offline CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Check owned-test container tooling
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Prepare local test issuer
        run: node infrastructure/init-local-customer-issuer.mjs
      - name: Verify backend
        working-directory: backend
        run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: '11.1.3'
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            examples/demo-site/pnpm-lock.yaml
      - name: Check owned-test container tooling
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Verify SDK before demo consumers
        run: |
          pnpm --dir frontend/sdk test --run
          pnpm --dir frontend/sdk typecheck
          pnpm --dir frontend/sdk build
      - name: Verify Admin
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --dir frontend/admin test --run
          pnpm --dir frontend/admin typecheck
          pnpm --dir frontend/admin lint
          pnpm --dir frontend/admin build
      - name: Install demo dependencies
        run: pnpm --dir examples/demo-site install --frozen-lockfile
      - name: Verify demo return handling and build
        run: |
          pnpm --dir examples/demo-site exec vitest run src/payment-return.test.ts src/vite-return-privacy.test.ts
          pnpm --dir examples/demo-site build
      - name: Install offline browser
        run: pnpm --dir examples/demo-site exec playwright install --with-deps chromium
      - name: Verify synthetic native Node support fixtures
        run: node --test --test-timeout=60000 --test-concurrency=1 examples/demo-site/tests/support/*.test.ts
      - name: Verify built offline return privacy with Chromium
        run: pnpm --dir examples/demo-site exec playwright test --config playwright.offline.config.ts --workers=1 --retries=0

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: '11.1.3'
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            examples/demo-site/pnpm-lock.yaml
      - name: Check owned-test container tooling
        run: |
          docker version
          docker compose version
          docker buildx version
      - name: Prepare SDK and demo dependencies for infrastructure tests
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend/sdk build
          pnpm --dir examples/demo-site install --frozen-lockfile
      - name: Verify offline infrastructure
        run: node --test --test-timeout=30000 --test-concurrency=1 infrastructure/*.test.mjs
