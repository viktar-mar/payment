services:
  backend:
    environment:
      PAYMENT_STRIPE_SANDBOX_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: local,stripe-sandbox
      PAYMENT_STRIPE_SANDBOX_SECRET_KEY: ${PAYMENT_STRIPE_SANDBOX_SECRET_KEY:?set Sandbox key}
      PAYMENT_STRIPE_SANDBOX_PUBLISHABLE_KEY: ${PAYMENT_STRIPE_SANDBOX_PUBLISHABLE_KEY:?set Sandbox key}
      PAYMENT_STRIPE_SANDBOX_WEBHOOK_SECRET: ${PAYMENT_STRIPE_SANDBOX_WEBHOOK_SECRET:?set Sandbox key}
